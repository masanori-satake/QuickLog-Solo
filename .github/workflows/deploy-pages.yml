name: 'CD: GitHub Pages デプロイ (Deploy Pages)'

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'shared/**'
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    uses: masanori-satake/common-workflows/.github/workflows/base-deploy-pages.yml@v1
    secrets: inherit
    with:
      publish_dir: '.'
      install_command: |
        echo "PUSHER_APP_ID=${{ '${{ secrets.PUSHER_APP_ID }}' }}" >> $GITHUB_ENV
        echo "PUSHER_KEY=${{ '${{ secrets.PUSHER_KEY }}' }}" >> $GITHUB_ENV
        echo "PUSHER_SECRET=${{ '${{ secrets.PUSHER_SECRET }}' }}" >> $GITHUB_ENV
        echo "PUSHER_CLUSTER=${{ '${{ secrets.PUSHER_CLUSTER }}' }}" >> $GITHUB_ENV
        npm ci
