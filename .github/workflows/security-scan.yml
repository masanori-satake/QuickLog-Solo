name: 'CI: 脆弱性検査 (Security Scan)'

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'projects/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 0 * * 0'
  # PR コメント（/ai-fix・/ai-bump）による push 後に CI を再実行するため
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  security:
    uses: masanori-satake/common-workflows/.github/workflows/base-security.yml@v1
