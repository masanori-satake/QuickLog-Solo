name: 'リリース: Webアプリケーションのデプロイ (Release: Deploy Web Applications)'

on:
    push:
        branches:
            - main
        paths:
            - 'projects/**'
            - 'shared/**'
            - 'scripts/**'
            - 'tests/**'
            - 'releases/**'
            - 'package.json'
            - 'package-lock.json'
            - 'vercel.json'
            - '.github/workflows/release_web_deploy.yml'
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-deploy:
        # このジョブは自己完結しており、他のワークフローに依存しません。
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 10
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup and Install Dependencies
              uses: ./.github/actions/setup-and-install
              with:
                  install-playwright: 'true'

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.x'

            - name: Cache Python dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install Python dependencies
              run: pip install -r requirements.txt

            - name: Build packages (Generates ZIPs and Branded Icons)
              run: npm run build

            - name: Prepare Deployment Directory
              run: |
                  mkdir -p dist_web
                  rsync -av --exclude='.*' vercel.json dist_web/
                  rsync -av --exclude='.*' projects/ dist_web/projects/
                  rsync -av --exclude='.*' shared/ dist_web/shared/
                  rsync -av --exclude='.*' releases/ dist_web/releases/
                  # Remove symlinks in dist_web to ensure they are real directories/files for Vercel
                  find dist_web -type l -delete

            - name: Verify build artifacts
              run: |
                  ls -R dist_web/releases/
                  [ -f dist_web/shared/assets/icon128.png ] || (echo "Icons missing" && exit 1)
                  VERSION=$(jq -r .version projects/app/version.json)
                  [ -f "dist_web/releases/QuickLog-Solo-Dev-v${VERSION}.zip" ] || (echo "Dev ZIP missing" && exit 1)
                  [ -f dist_web/projects/web/index.html ] || (echo "Landing page missing" && exit 1)

            - name: Deploy to Vercel
              uses: amondnet/vercel-action@v42.2.0
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
                  working-directory: ${{ github.workspace }}/dist_web
                  target: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
