name: 'CI: テストカバレッジ (Coverage)'

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    uses: masanori-satake/common-workflows/.github/workflows/base-coverage.yml@v1
