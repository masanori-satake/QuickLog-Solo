name: 'CI: バージョン検証 (Version Verification)'

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/app/**'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-bump:
    uses: masanori-satake/common-workflows/.github/workflows/base-version-bump.yml@v1
