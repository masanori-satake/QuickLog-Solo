name: 'Setup and Install'
description: 'Set up Node.js, cache dependencies, run npm ci, and optionally install Playwright'
inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  install-playwright:
    description: 'Whether to install Playwright'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Cache Playwright browsers
      if: ${{ inputs.install-playwright == 'true' }}
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright browsers (cache miss)
      if: ${{ inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
      run: npx playwright install --with-deps chromium
      shell: bash

    - name: Install Playwright system dependencies only (cache hit)
      if: ${{ inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true' }}
      run: npx playwright install-deps chromium
      shell: bash
